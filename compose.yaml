services:
  api:
    build:
      context: .
      target: backend
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - delivery-data:/var/lib/cartech
    expose:
      - "8000"

  web:
    build:
      context: .
      target: web
      args:
        VITE_APP_AUTH_ENABLED: "false"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CARTECH_DOMAIN: ${CARTECH_DOMAIN:?Set CARTECH_DOMAIN in .env}
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      # Public certificate of the private CA that signs permitted client devices.
      # Keep the CA private key off the VPS.
      - ${CARTECH_CLIENT_CA_PATH:?Set CARTECH_CLIENT_CA_PATH in .env}:/etc/caddy/client-ca.pem:ro

volumes:
  delivery-data:
  caddy-data:
  caddy-config:
